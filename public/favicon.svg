<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF9D" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="rgba(0, 255, 157, 0.3)" stroke-width="1.5"/>

  <!-- Radar Grid Circles -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#00FF9D" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.6"/>
  <circle cx="32" cy="32" r="18" fill="none" stroke="#00E5FF" stroke-width="1.4" opacity="0.8"/>
  <circle cx="32" cy="32" r="10" fill="none" stroke="#eab308" stroke-width="1.0" opacity="0.7"/>

  <!-- Crosshairs -->
  <line x1="32" y1="6" x2="32" y2="58" stroke="#00FF9D" stroke-width="0.75" opacity="0.3"/>
  <line x1="6" y1="32" x2="58" y2="32" stroke="#00FF9D" stroke-width="0.75" opacity="0.3"/>

  <!-- Sweeping Radar Beam -->
  <polygon points="32,32 54,16 58,24" fill="url(#beamGrad)" opacity="0.6"/>
  <line x1="32" y1="32" x2="56" y2="20" stroke="#00FF9D" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Dynamic Proxemics Point (Pedestrian) -->
  <circle cx="46" cy="22" r="3.2" fill="#FF0055" filter="url(#glow)"/>
  <circle cx="46" cy="22" r="6" fill="none" stroke="#FF0055" stroke-width="0.8" opacity="0.5"/>

  <!-- AMR Mobile Robot Center (Heading Arrow Shape) -->
  <polygon points="32,22 39,39 32,35 25,39" fill="#00FF9D" stroke="#ffffff" stroke-width="1.0" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="2.2" fill="#ffffff"/>
</svg>
